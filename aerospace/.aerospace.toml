# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# It's not necessary to copy all keys to your config.
# If the key is missing in your config, "default-config.toml" will serve as a fallback

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
	'exec-and-forget sketchybar',
	'exec-and-forget borders'
]

# Notify Sketchybar about workspace change
exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Start AeroSpace at login
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 48

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 16
inner.vertical =   16
outer.left =       16
outer.bottom =     16
# outer.top =        44
outer.right =      16

outer.top =     [
  { monitor.'built-in.*' = 44 },
  { monitor.'LG.*' = 76 },
  76
]

# https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[workspace-to-monitor-force-assignment]
9 = ['Built-in Retina Display']

# Make Chrome itself float when file dialogs are active (unfortunately no better way)
# [[on-window-detected]]
# if.app-id = 'com.google.Chrome'
# run = 'layout floating'
# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# You can uncomment this line to open up terminal with alt + enter shortcut
# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget

alt-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'
alt-shift-o = 'exec-and-forget open -a /Applications/Obsidian.app'
alt-shift-s = 'exec-and-forget open -a Safari'

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Focus monitor directly
alt-ctrl-h = 'focus-monitor left'
alt-ctrl-l = 'focus-monitor right'


# Move window to next / previous workspace
alt-shift-n = 'move-node-to-workspace next'
alt-shift-p  = 'move-node-to-workspace prev'


# Split direction explicitly
alt-shift-5 = 'layout tiles vertical'   # %
alt-shift-quote = 'layout tiles horizontal'  # "

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Grouping commands
alt-shift-rightSquareBracket = 'join-with right'  # Join current window with the one to the right
alt-shift-leftSquareBracket = 'join-with left'  # Join current window with the one to the right
alt-shift-u = 'flatten-workspace-tree'  # Join current window with the one to the right

alt-shift-c = 'move-mouse monitor-lazy-center'  # Center mouse on monitor

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-9 = 'workspace 9' # 2nd monitor

alt-a = 'workspace A' # for Browser
alt-b = 'workspace B' # for Browser

alt-c = 'workspace C' # for Calendar / Teams
alt-d = 'workspace D' # for Docker / DBMS
alt-o = 'workspace O' # for Obsidian /Notes
alt-m = 'workspace M' # for Slack / Messages

alt-r = 'workspace R' # for Rider
alt-s = 'workspace S' # for PrusaSlicer / System settings / vpn...
alt-t = 'workspace T' # for Terminal
alt-v = 'workspace V' # for vscode

cmd-ctrl-alt-shift-1 =[ 'move-node-to-workspace 1', 'workspace 1']
cmd-ctrl-alt-shift-2 =[ 'move-node-to-workspace 2', 'workspace 2']
cmd-ctrl-alt-shift-3 =[ 'move-node-to-workspace 3', 'workspace 3']
cmd-ctrl-alt-shift-9 =[ 'move-node-to-workspace 9', 'workspace 9'] # 2nd monitor

cmd-ctrl-alt-shift-a =[ 'move-node-to-workspace A', 'workspace A']  # for Browser
cmd-ctrl-alt-shift-b =[ 'move-node-to-workspace B', 'workspace B']  # for Browser

cmd-ctrl-alt-shift-c =[ 'move-node-to-workspace C', 'workspace C']  # for Calendar / Teams
cmd-ctrl-alt-shift-d =[ 'move-node-to-workspace D', 'workspace D']  # for Docker / DBMS
cmd-ctrl-alt-shift-o =[ 'move-node-to-workspace O', 'workspace O']  # for Obsidian/ Notes
cmd-ctrl-alt-shift-m =[ 'move-node-to-workspace M', 'workspace M']  # for Slack / Messages

cmd-ctrl-alt-shift-r =[ 'move-node-to-workspace R', 'workspace R']  # for Rider
cmd-ctrl-alt-shift-s =[ 'move-node-to-workspace S', 'workspace S']  # for PrusaSlicer / system settings / vpn..
cmd-ctrl-alt-shift-t =[ 'move-node-to-workspace T', 'workspace T']  # for Terminal
cmd-ctrl-alt-shift-v =[ 'move-node-to-workspace V', 'workspace V']  # for vscode


alt-tab = 'workspace-back-and-forth'
alt-shift-tab = [
  'move-workspace-to-monitor --wrap-around next',
]


alt-shift-semicolon = [
  'mode service',
]

cmd-alt-ctrl-shift-q = [
  'mode service',
]

# Toggle fullscreen
alt-shift-f = 'fullscreen'
cmd-ctrl-alt-shift-f = 'layout floating tiling'
cmd-ctrl-alt-shift-tab = 'layout tiles accordion'
cmd-ctrl-alt-shift-n = 'workspace-back-and-forth'
cmd-ctrl-alt-shift-l = 'layout horizontal vertical'

cmd-ctrl-alt-shift-x = [
 'reload-config',
 'exec-and-forget osascript -e "display notification \"Aerospace & Sketchybar reloaded\" with title \"AeroSpace\""',
 'exec-and-forget sketchybar --reload',

]
# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes


[mode.service.binding]
esc = [
  'reload-config',
  'mode main',
]
r = [
  'flatten-workspace-tree',
  'mode main',
]

# figure out app-id by running:
# aerospace list-windows --all --format "%{window-id} | %{app-bundle-id} | %{app-name}"
# 123 | com.mitchellh.ghostty | Ghostty
# 456 | com.google.Chrome | Google Chrome
# 789 | md.obsidian | Obsidian

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace O'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace S'
